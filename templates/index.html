<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rosetta — Traduction FR → EN</title>
    <style>
        body {
            margin: 0;
            background: #f4f4f5;
            color: #18181b;
            font-family: Arial, sans-serif;
        }

        main {
            width: min(640px, calc(100% - 32px));
            margin: 64px auto;
            padding: 28px;
            box-sizing: border-box;
            border: 1px solid #d4d4d8;
            border-radius: 10px;
            background: white;
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
        }

        label {
            display: block;
            margin: 18px 0 6px;
            font-weight: 600;
        }

        textarea,
        select,
        button {
            width: 100%;
            box-sizing: border-box;
            font: inherit;
        }

        textarea,
        select {
            padding: 10px;
            border: 1px solid #a1a1aa;
            border-radius: 6px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            margin-top: 20px;
            padding: 11px;
            border: 0;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        .result,
        .error {
            margin-top: 22px;
            padding: 14px;
            border-radius: 6px;
        }

        .result {
            background: #eff6ff;
        }

        .error {
            background: #fef2f2;
            color: #991b1b;
        }
    </style>
</head>
<body>
<main>
    <h1>Traduction français → anglais</h1>

    <form method="post">
        <label for="sourceText">Phrase française</label>
        <textarea
            id="sourceText"
            name="sourceText"
            maxlength="1000"
            required
            placeholder="Écrivez une phrase en français…"
        >{{ sourceText }}</textarea>

        <label for="modelName">Modèle</label>
        <select id="modelName" name="modelName">
            {% for modelName, label in modelLabels.items() %}
            <option value="{{ modelName }}" {% if modelName == selectedModel %}selected{% endif %}>
                {{ label }}
            </option>
            {% endfor %}
        </select>

        <button type="submit">Traduire</button>
    </form>

    {% if translation is not none %}
    <div class="result">
        <strong>Traduction :</strong>
        <div>{{ translation or "Le modèle n’a produit aucun mot." }}</div>
    </div>
    {% endif %}

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
</main>
</body>
</html>
